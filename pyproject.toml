[project]
name = "mtf-signal-research"
version = "0.1.0"
description = "Research platform for systematic crypto perpetuals trading"
requires-python = ">=3.12"
dependencies = [
    "lz4>=4.4.5",
    "numpy>=2.5.4",
    "polars>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
